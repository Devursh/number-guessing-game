<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
    <title>Document</title>
    <script src="https://kit.fontawesome.com/96e99f088c.js" crossorigin="anonymous"></script>
</head>
<body>
    <main class="card">
        <i class="fa-solid fa-bullseye main-icon"></i>
        <h1 class="heading">Guess the Number</h1>
        <p class="heading-paragraph">I'm thinking of a number between 1 and 100. <br>Can you guess it?</p>
        <div class="buttons">
            <input type="text" placeholder="Enter a number (1-100)" class="guess-input">
            <button class="guess-button">Guess</button>
        </div>
        <div class="important-reminder">
            <i class="fa-regular fa-lightbulb lightbulb-icon"></i>
            <p>Enter a number and make your first guess!</p>
        </div>
        <div class="horizontal-info">
            <div class="attempts-container">
                <i class="fa-solid fa-rotate-left rotate-left-icon"></i>
                <div class="attempts-text">
                    <p class="attempts-heading">Attempts</p>
                    <p class="attempts-counter">0</p>
                </div>
            </div>
            <button class="new-game-button"><i class="fa-solid fa-rotate-right rotate-right-icon"></i>New game</button>
        </div>
    </main>
</body>
</html>
